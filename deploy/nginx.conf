# Production example for Ubuntu 24.04 with PHP 8.3 FPM.
# Install source in /srv/ted2, set TED2_BASE_URL to the real HTTPS origin,
# and place this listener behind an HTTPS reverse proxy. Do not expose bare HTTP.
server {
    listen 127.0.0.1:8080;
    server_name _;
    root /srv/ted2/public;
    client_max_body_size 84m;
    access_log off;
    error_log /var/log/nginx/ted2-error.log warn;
    # The front controller enforces active public-media approval and private access.
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/ted2/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 330s;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
