:root{--forest:#234d3b;--deep:#15392d;--green:#356c51;--ink:#24352e;--muted:#657169;--cream:#f5f4ed;--paper:#fffefa;--line:#d8dfd4;--sage:#e5ecdf;--gold:#ae8238;--white:#fff;--max:1220px;--serif:Georgia,'Times New Roman',serif;--sans:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}

.container{width:min(calc(100% - 96px),var(--max));margin-inline:auto}

.button{display:inline-flex;align-items:center;justify-content:center;gap:20px;padding:14px 21px;min-height:48px;border:1px solid var(--forest);background:var(--forest);color:var(--white);text-decoration:none;font-size:.8rem;font-weight:600;line-height:1.5;transition:background .2s,transform .2s}

.media-fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px;text-align:center;padding:36px;background:var(--sage);color:var(--forest)}

.section-nav{background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.section-nav .container{display:flex;gap:30px;padding-block:16px;align-items:center;overflow:auto;scrollbar-width:thin}
.section-nav span{color:var(--muted);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.section-nav a{font-size:.74rem;text-decoration:none;white-space:nowrap}
.section{padding-block:84px}

/* V3: source-backed team portraits, homepage alerts, and certificate recognition. */
.alerts-section{background:#f0f3eb;border-bottom:1px solid var(--line)}
.alert-eyebrow{display:flex;align-items:center;gap:9px}
.alert-eyebrow span{width:8px;height:8px;border-radius:50%;background:var(--green)}

.event-list{display:grid;gap:17px}
.event-card{display:flex;gap:22px;padding:24px;background:var(--paper);border:1px solid var(--line);min-width:0}
.event-date{flex:0 0 80px;align-self:start;min-height:95px;background:var(--forest);color:#fff;text-align:center;padding:10px 4px;display:flex;flex-direction:column;justify-content:center}
.event-date>span{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase}

.seminar-stack{display:grid;gap:20px;min-width:0}

.activity-host{margin:24px 0;font-size:.86rem}

.content-section>.event-list{margin-top:22px}

.profile-image{object-position:center 27%}

/* V4: supplied laboratory photograph, small finite movement; no continual distraction. */
.hero{position:relative;isolation:isolate;overflow:hidden}
.hero>.hero-grid{position:relative;z-index:1}
.lab-photo-atmosphere{position:absolute;inset:-8% -4% -8% 20%;z-index:-1;opacity:.065;pointer-events:none;mask-image:linear-gradient(90deg,transparent,#000)}

.hero-has-motion .hero-visual{animation:lab-arrive 1.1s ease-out both,lab-float 3.8s ease-in-out 1.1s 1;transform:rotate(var(--photo-tilt,0deg));transform-origin:center}

.hero-photo{min-height:430px}.hero-photo>.hero-remote{object-position:center 43%}
.photo-label small{display:block;max-width:27em;line-height:1.5}.photo-label br{display:none}
@keyframes lab-arrive{from{opacity:.5;translate:0 8px}to{opacity:1;translate:0 0}}
@keyframes lab-float{0%,100%{translate:0 0}50%{translate:0 -5px}}
@keyframes lab-atmosphere{0%,100%{translate:0 0}50%{translate:3px -4px}}
.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start}

.gallery-card img{aspect-ratio:4/3;object-fit:cover}.gallery-card figcaption{padding:21px}.gallery-card h3{font-size:1.25rem;margin-bottom:10px}.gallery-card figcaption small{display:block;font-size:.73rem;margin-top:13px;color:var(--muted,#566)}
.media-document{padding:35px;text-align:center;background:#eef2e7}.media-document>span{font:2rem Georgia;display:block;margin-bottom:20px}
.custom-section-copy{max-width:800px;margin-bottom:30px}.custom-section-copy>p:empty{display:none}.custom-section.layout-media-left .custom-section-inner,.custom-section.layout-media-right .custom-section-inner{display:grid;grid-template-columns:1fr 1fr;gap:42px;align-items:center}.custom-section.layout-media-left .gallery-grid{order:-1}.custom-section.layout-media-left .gallery-grid,.custom-section.layout-media-right .gallery-grid{grid-template-columns:1fr}.profile-contact{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0 0 25px}.profile-contact:empty{display:none}.profile-contact dt{font-size:.72rem;text-transform:uppercase;color:var(--muted,#566)}.profile-contact dd{margin:4px 0;overflow-wrap:anywhere}
.custom-section-inner .custom-section .container{width:100%}.primary-nav{flex-wrap:wrap}

@media(max-width:600px){.gallery-grid,.profile-contact{grid-template-columns:1fr}.lab-photo-atmosphere{inset:10% -20% 0 0;opacity:.04}.hero-photo{min-height:330px}.photo-label{left:12px;right:12px}.custom-section .container{width:100%}}
@media(prefers-reduced-motion:reduce){.hero-has-motion .hero-visual,.hero-has-motion .lab-photo-atmosphere{animation:none!important;transform:none!important;translate:none!important}}

<script>window.TED2_CONFIG={"live":false,"apiBase":""};window.TED2_DATA={"settings":[{"id":"laboratory","title":"Tissue Engineering \u0026 Drug Development Laboratory","short_name":"TED²","institution":"University of Namibia","hero_title":"Engineering better biomedical solutions.","hero_intro":"Research at the interface of advanced cell culture, biomaterials, regenerative therapeutics, drug delivery and microscale biomedical platforms.","contact_name":"Dr Albertina Shatri","contact_email":"aiikasha@unam.na","address":"Hage Geingob Campus\nBach Street\nWindhoek, Namibia","hero_image_url":"public-media/87f532a269984bc622e32155092e949e53708022f4de05f98888adcf2449c1d5.jpg","hero_image_credit":"Photograph supplied by the laboratory owner.","hero_image_source":"","materials_image_url":"https://user-images.strikinglycdn.com/res/hrscywv4p/image/upload/c_clip%2Cw_960%2Ch_720%2Cf_auto%2Cq_auto/unsplashcom/photo-1617155093758-158e4e5dcfe9","materials_image_credit":"Strikingly-hosted Unsplash image photo-1617155093758-158e4e5dcfe9; photographer identity not confirmed.","microscopy_image_url":"https://user-images.strikinglycdn.com/res/hrscywv4p/image/upload/c_clip%2Cw_960%2Ch_720%2Cf_auto%2Cq_auto/unsplashcom/photo-1631049124964-f93fd879fec9","microscopy_image_credit":"Strikingly-hosted Unsplash image photo-1631049124964-f93fd879fec9; photographer identity not confirmed.","reviewed":"2026-09-10","hero_motion":true,"hero_image_alt":"Researchers working together around a laboratory bench.","hero_image_caption":"Inside the laboratory — learning, collaboration and discovery.","hero_eyebrow":null,"research_title":null,"interactions_title":null,"scaffolds_title":null,"people_title":null,"alerts_title":null,"contacts_title":null,"media_items":[]}],"capabilities":[{"id":"2d-vs-3d-dynamic","title":"2D vs 3D Dynamic","text":"Our research includes comparative studies of cell behavior in 2D and 3D environments, revealing crucial differences that impact tissue regeneration outcomes.","order":8,"media_items":[]},{"id":"advanced-3d-cell-culture","title":"Advanced 3D Cell Culture","text":"Our laboratory utilizes state-of-the-art 3D culture systems that closely mimic the natural tissue environment, enabling more accurate studies of tissue regeneration and cellular behavior.","order":1,"media_items":[]},{"id":"application-in-medicine","title":"Application in medicine","text":"The scaffolds and nanomaterials we develop are applied across various medical fields, including orthopedics, wound healing, Gastric complications and dental applications, demonstrating their versatility.","order":12,"media_items":[]},{"id":"biomaterial-development","title":"Biomaterial Development","text":"We focus on the creation of biocompatible materials that support cell growth and tissue integration, ensuring effective and durable healing processes.","order":2,"media_items":[]},{"id":"design-innovations","title":"Design innovations","text":"Our team implements innovative designs in scaffold architecture to optimize nutrient flow and cellular interaction, crucial for effective tissue repair.","order":11,"media_items":[]},{"id":"functional-outcome","title":"Functional Outcome","text":"By analyzing cell-material interactions, we aim to predict functional outcomes of tissue engineering strategies, enhancing the effectiveness of our regenerative approaches.","order":9,"media_items":[]},{"id":"material-development","title":"Material development","text":"We focus on the synthesis of biocompatible scaffolds that support cell adhesion and growth, serving as a foundation for tissue regeneration.","order":10,"media_items":[]},{"id":"material-selection","title":"Material selection","text":"We explore various biomaterials to determine their compatibility with specific cell types, ensuring optimal integration and performance in regenerative applications.","order":7,"media_items":[]},{"id":"microscale-platform","title":"Microscale platform","text":"Our micro-scale delivery platforms are engineered to release drugs in a controlled manner, allowing for sustained therapeutic effects while minimizing side effects.","order":5,"media_items":[]},{"id":"precision-drug-delivery","title":"Precision in Drug Delivery","text":"We develop cutting-edge nanoparticle systems designed to enhance bioavailability and targeted delivery of therapeutics, improving outcomes in various medical applications.","order":4,"media_items":[]},{"id":"regenerative-therapeutics","title":"Regenerative therapeutics","text":"Our research encompasses a wide range of regenerative therapies aimed at restoring function and alleviating damage caused by injury or disease.","order":3,"media_items":[]},{"id":"understanding-interactions","title":"Understanding Interactions","text":"We investigate how different materials influence cell adhesion, proliferation, and differentiation, providing valuable insights for tissue engineering applications.","order":6,"media_items":[]}],"people":[{"id":"albertina-shatri","name":"Dr Albertina Shatri","group":"researcher","role":"Project Principal Investigator · School of Medicine, UNAM","bio":"Dr Albertina Shatri is the Project Principal Investigator in the CRP–ICGEB research grant collaboration. The team presentation places her in the School of Medicine at the University of Namibia.","topics":["Tissue engineering","Nanomedicine"],"work":"CRP–ICGEB research grant collaboration: project leadership across the named University of Namibia and University of Pretoria team.\n\nThe laboratory’s May 2025 nanoendodontic report also describes her leadership of informed-consent training with Dr Silas Bere at Katutura.","note":"Name, project role and affiliation follow Team.pptx, slide 2. The historical workshop activity is supported separately by the laboratory report. University works listed below retain their original evidence labels.","scholar_url":"https://scholar.google.com/citations?hl=en\u0026user=qHscwtEAAAAJ","researchgate_url":"https://www.researchgate.net/profile/Albe ipt>/* Public SPA: all dynamic text is escaped; external links are protocol-checked. */
'use strict';
(() => {
    const cfg = window.TED2_CONFIG || { live: false, apiBase: '' };
    let data = window.TED2_DATA || {};
    const main = document.getElementById('main'), nav = document.getElementById('primary-nav');
    const E = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const rows = c => data[c] || [];
    const one = (c, id) => rows(c).find(p => p.id === id);
    const safeURL = u => { try {
        const v = new URL(u);
        return ['http:', 'https:'].includes(v.protocol) ? v.href : '';
    }
    catch {
        return '';
    } };
    const external = (u, label, cls = '') => safeURL(u) ? `<a class="${E(cls)}" href="${E(safeURL(u))}" target="_blank" rel="noopener noreferrer">${E(label)} ↗</a>` : '';
    const profileSlugs = {'denis-bouman':'denise-bouman','manelia-halweendo':'maneria-halweendo','charity-mepa':'charity-maepa','nonku-phiri':'nonku-phili','jaydine-jeris':'jaydine-feris'};
    const publicPath = path => path.replace(/^profiles\/([^?]+)/, (match, id) => 'profiles/' + (profileSlugs[id] || id));
    const link = (path, label, cls = '') => `<a class="${E(cls)}" href="#/${E(publicPath(path))}">${E(label)}</a>`;
    const initials = n => n.replace(/^(Prof|Dr|Ms|Mr|Mrs)\.?\s+/i, '').split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join('');
    const mediaURL = u => /^(?:public-media\/[a-f0-9]{64}\.(?:jpg|png|webp|pdf|mp4|webm)|\/media\/[a-f0-9]{32})$/.test(u || '') ? u : (/^data:(?:image\/(?:jpeg|png|webp)|video\/(?:mp4|webm)|application\/pdf);base64,[A-Za-z0-9+/=]+$/.test(u || '') ? u : safeURL(u));
    const mediaLink = (u,label,cls='') => {
        const source=mediaURL(u);
        if (!source) return '';
        const download=source.startsWith('data:application/pdf;') ? ' download="TED2-document.pdf"' : '';
        return `<a href="${E(source)}" class="${E(cls)}"${download} target="_blank" rel="noopener">${E(label)} ↗</a>`;
    };
    const portrait = p => { const v = p.photo_url || ''; return mediaURL(v); };
    function avatar(p, size = '') { const u = portrait(p); return `<span class="avatar ${E(size)}" aria-label="${u ? 'Portrait from attributed source' : 'Initials for'} ${E(p.name)}"><span aria-hidden="true">${E(initials(p.name))}</span>${u ? `<img class="profile-image" src="${E(u)}" alt="${E(p.name)}" loading="lazy" referrerpolicy="no-referrer">` : ''}</span>`; }
    const empty = (title, text) => `<div class="empty-state"><strong>${E(title)}</strong>${E(text)}</div>`;
    const nice = v => String(v || '').replace(/-/g, ' ').replace(/^\w/, c => c.toUpperCase());
    const tags = items => `<div class="chips">${(items || []).map(t => `<span class="chip">${E(t)}</span>`).join('')}</div>`;
    const head = (label, title, intro = '') => `<section class="page-heading"><div class="container"><div class="breadcrumbs">${link('', 'Home')} <span>/</span> ${E(label)}</div><p class="eyebrow">${E(label)}</p><h1>${E(title)}</h1>${intro ? `<p class="lead">${E(intro)}</p>` : ''}</div></section>`;
    const side = () => `<aside class="side-nav"><p class="side-title">Research directory</p><nav>${[['researchers', 'Researchers'], ['activity', 'Activity & alerts'], ['publications', 'Publications'], ['research', 'Active research'], ['pipeline', 'Manuscript pipeline'], ['collaborators', 'Collaborations'], ['funders', 'Funders'], ['sources', 'Sources & credits']].map(([u, t]) => link(u, t)).join('')}</nav><p class="side-note">Only approved public information is shown here. Private milestones, reviewer notes and draft files remain in the researcher workspace.</p></aside>`;
    const page = (label, title, intro, html, sidebar = false) => head(label, title, intro) + `<section class="container page-body ${sidebar ? 'directory-layout' : ''}">${sidebar ? side() : ''}<div>${html}</div></section>`;
    function toast(text) { const t = document.getElementById('toast'); t.textContent = text; t.hidden = false; setTimeout(() => t.hidden = true, 3500); }
    function personCard(p) { return `<article class="person-card">${avatar(p)}<p class="eyebrow">${E(p.group)}</p><h2>${link('profiles/' + p.id, p.name)}</h2><p>${E(p.role)}</p>${tags(p.topics)}${link('profiles/' + p.id, 'Profile & selected work →', 'text-link')}</article>`; }
    function pubCard(p) { const url = p.doi ? 'https://doi.org/' + p.doi : p.source_url; return `<article class="publication-card" id="pub-${E(p.id)}"><div class="publication-meta"><span class="record-type ${p.type !== 'peer-reviewed' ? 'limited' : ''}">${E(nice(p.type))}</span><span>${E(p.year)}</span><span>${E(p.venue)}</span></div><h3>${external(url, p.title) || E(p.title)}</h3><p class="authors">${E((p.authors || []).join('; '))}</p><p class="pub-summary">${E(p.summary)}</p><div class="pub-actions">${external(p.source_url, 'Source record')}${p.doi ? external('https://doi.org/' + p.doi, 'DOI') : ''}${p.document_url ? mediaLink(p.document_url, 'Approved PDF') : ''}<button class="copy-button" data-copy="${E(p.id)}">Copy citation</button></div>${p.note ? `<details><summary>Evidence & attribution</summary><p>${E(p.note)}</p></details>` : ''}${extraBlock('publications',p)}</article>`; }
    function projectCard(p) { const val = Number.isFinite(Number(p.public_progress)) && p.public_progress !== null ? Math.max(0, Math.min(100, Number(p.public_progress))) : null; return `<article class="record-card"><span class="chip">${E(nice(p.stage))}</span><h3>${link('research/' + p.id, p.title)}</h3><p>${E(p.summary)}</p>${val !== null ? `<progress value="${val}" max="100" aria-label="Approved public progress"></progress><p class="progress-label">${val}% · approved public progress</p>` : ''}<div class="actions">${link('research/' + p.id, 'View research →', 'text-link')}</div>${extraBlock('projects',p)}</article>`; }
    function manuscriptCard(p) { return `<article class="record-card"><span class="chip">${E(nice(p.stage))}</span><h3>${E(p.title)}</h3><p>${E(p.summary)}</p>${p.journal ? `<p>${E(p.journal)}</p>` : ''}${tags((p.people || []).map(id => one('people', id)?.name).filter(Boolean))}${p.doi ? external('https://doi.org/' + p.doi, 'Published DOI') : ''}${extraBlock('manuscripts',p)}</article>`; }
    function collabCard(p) { return `<article class="record-card"><p class="eyebrow">${E(p.partner)}</p><h3>${link('collaborations/' + p.id, p.title)}</h3><p>${E(p.summary)}</p><div class="actions">${link('collaborations/' + p.id, 'Collaboration details →', 'text-link')}</div>${extraBlock('collaborations',p)}</article>`; }
    // Date-only notices are compared in Namibia time; no UTC-midnight day shift.
    function today() {
        const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Africa/Windhoek', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
        const part = kind => parts.find(x => x.type === kind).value;
        return `${part('year')}-${part('month')}-${part('day')}`;
    }
    function dates(start, end) {
        if (!start) return 'Dates to be announced';
        const a = new Date(start + 'T12:00:00'), b = new Date((end || start) + 'T12:00:00');
        if (Number.isNaN(+a) || Number.isNaN(+b)) return 'Date awaiting confirmation';
        const fmt = (d, opts) => d.toLocaleDateString('en-GB', opts);
        if (!end || end === start) return fmt(a, { day: 'numeric', month: 'long', year: 'numeric' });
        if (start.slice(0, 7) === end.slice(0, 7)) return `${a.getDate()}–${b.getDate()} ${fmt(a, { month: 'long', year: 'numeric' })}`;
        return `${fmt(a, { day: 'numeric', month: 'short', year: 'numeric' })} – ${fmt(b, { day: 'numeric', month: 'short', year: 'numeric' })}`;
    }
    const upcoming = a => !(a.end_date || a.start_date) || (a.end_date || a.start_date) >= today();
    const byDate = (a, b) => (a.start_date || '9999').localeCompare(b.start_date || '9999') || a.title.localeCompare(b.title);
    const dateEvidence = a => a.date_status === 'date-conflict' ? 'Date confirmation pending' : a.date_status === 'date-to-be-announced' ? 'Coming soon' : a.date_status === 'lab-supplied' ? 'Laboratory schedule' : 'Conference dates confirmed';
    function dateTile(a) {
        if (!a.start_date) return '<div class="event-date undated"><span>Coming</span><strong>soon</strong></div>';
        const start = new Date(a.start_date + 'T12:00:00');
        const sameMonth = a.end_date && a.end_date.slice(0, 7) === a.start_date.slice(0, 7);
        return `<div class="event-date"><span>${E(start.toLocaleDateString('en-GB', { month: 'short' }))}</span><strong>${start.getDate()}${sameMonth && a.end_date !== a.start_date ? '–' + Number(a.end_date.slice(8)) : ''}</strong><small>${E(a.start_date.slice(0, 4))}</small></div>`;
    }
    function announcementCard(a, compact = false) {
        return `<article class="event-card" data-event="${E(a.id)}">${dateTile(a)}<div class="event-copy"><p class="eyebrow">${E(a.kind === 'conference' ? 'Conference presentation' : nice(a.kind))}${!upcoming(a) ? ' · Past activity' : ''}</p><h3>${link('activity/' + a.id, a.title)}</h3><p class="event-range">${E(dates(a.start_date, a.end_date))}</p><span class="event-badge ${a.date_status === 'date-conflict' ? 'date-warning' : ''}">${E(dateEvidence(a))}</span>${compact ? '' : `<p>${E(a.description)}</p><details class="event-evidence"><summary>Date & participation evidence</summary><p>${E(a.evidence_note)}</p></details>`}<div class="event-links">${link('activity/' + a.id, 'Read activity details →')}${external(a.official_url, 'Official host page')}</div></div></article>`;
    }
    function homeAlerts() {
        const all = rows('announcements').filter(a => a.homepage && upcoming(a));
        if (!all.length) return '';
        const conferences = all.filter(a => a.kind === 'conference').sort(byDate);
        const other = all.filter(a => a.kind !== 'conference').sort(byDate);
        const conflict = conferences.find(a => a.date_status === 'date-conflict');
        return `<section class="section alerts-section" id="alerts" aria-labelledby="alerts-heading"><div class="container"><div class="section-head"><div><p class="eyebrow alert-eyebrow"><span aria-hidden="true"></span> Alerts</p><h2 id="alerts-heading">${E(rows('settings')[0]?.alerts_title||'Upcoming conference presentations.')}</h2></div>${link('activity', 'All laboratory activity →', 'text-link')}</div><div class="alerts-grid"><div class="event-list">${conferences.map(a => announcementCard(a, true)).join('') || empty('No upcoming conference presentations.', 'Seminar and laboratory notices appear alongside this schedule.')}${conflict ? `<div class="date-discrepancy"><strong>NCRST date check.</strong> The laboratory supplied <strong>${E(dates(conflict.start_date, conflict.end_date))}</strong>; the organiser’s available call lists <strong>${E(dates(conflict.official_start_date, conflict.official_end_date))}</strong>. Please confirm the date with NCRST. ${external(conflict.official_url, 'Official organiser notice')}</div>` : ''}</div><aside class="seminar-stack" aria-label="Coming soon">${other.map(a => `<article class="seminar-notice"><p class="eyebrow">Coming soon · ${E(nice(a.kind))} series</p><span class="seminar-index" aria-hidden="true">TED² / EXCHANGE</span><h3>${E(a.title)}</h3><p>${E(a.description.replace(/^Coming soon:\s*/i, '').replace(/^./, c => c.toUpperCase()))}</p><p class="seminar-note">${E(a.evidence_note)}</p><div class="actions">${link('activity/' + a.id, 'Series announcement →', 'button secondary')}</div></article>`).join('')}</aside></div></div></section>`;
    }
    function certificateButton(a) {
        if (!a.document_url) return '';
        if (a.document_url.startsWith('data:application/pdf;base64,')) return `<button class="button secondary" type="button" data-certificate="${E(a.id)}">Download participation certificate (PDF)</button>`;
        return mediaLink(a.document_url, 'Participation certificate (PDF)', 'button secondary');
    }
    function achievementCard(a, teaser = false) {
        const researcher = one('people', a.researcher_id);
        const preview = mediaURL(a.certificate_preview);
        if (teaser) return `<article class="recognition-teaser"><div><p class="eyebrow">Researcher recognition · ${E(dates(a.date))}</p><h3>${E(a.title)}</h3><p>${E(a.summary)}</p>${link('profiles/' + a.researcher_id + '?section=recognition', 'Read the achievement & view the certificate →', 'text-link')}</div>${preview ? `<a class="certificate-thumb" href="#/profiles/${E(a.researcher_id)}?section=recognition" aria-label="View ${E(researcher?.name || '')}’s certificate"><img src="${E(preview)}" alt="Falling Walls participation certificate supplied by the researcher" loading="lazy"></a>` : ''}</article>`;
        return `<article class="achievement-card" id="achievement-${E(a.id)}"><p class="eyebrow">${E(dates(a.date))}</p><h3>${E(a.title)}</h3><p>${E(a.summary)}</p><div class="certificate-layout">${preview ? `<figure class="certificate-preview"><img src="${E(preview)}" alt="Participation certificate naming Paulus Hamutenya, Falling Walls Lab Windhoek, Namibia, 25 August 2026" loading="lazy"><figcaption>Preview of the supplied certificate. The PDF preserves the original document.</figcaption></figure>` : ''}<div class="certificate-info"><h4>Participation certificate</h4><p>${E(a.evidence_note)}</p><div class="actions">${certificateButton(a)}</div></div></div>${extraBlock('achievements',a)}</article>`;
    }
    function homeRecognition() {
        const selected = rows('achievements').filter(a => a.homepage);
        return selected.length ? `<section class="section recognition-section" id="recognition"><div class="container">${selected.map(a => achievementCard(a, true)).join('')}</div></section>` : '';
    }
    function activity(id) {
        if (id) {
            const a = one('announcements', id);
            if (!a) return notFound();
            const team = (a.people || []).map(pid => one('people', pid)).filter(Boolean);
            return page('Laboratory activity', a.title, dates(a.start_date, a.end_date), `<div class="activity-detail">${announcementCard(a)}${a.host ? `<p class="activity-host"><strong>Host:</strong> ${E(a.host)}${a.location ? `<br><strong>Location:</strong> ${E(a.location)}` : ''}</p>` : ''}${a.date_status === 'date-conflict' ? `<div class="date-discrepancy"><strong>Date discrepancy:</strong> laboratory schedule ${E(dates(a.start_date, a.end_date))}; host-published call ${E(dates(a.official_start_date, a.official_end_date))}. Confirmation remains pending.</div>` : ''}${extraBlock('announcements',a)}${team.length ? `<section class="content-section"><h2>Presenting researchers</h2><div class="person-grid">${team.map(personCard).join('')}</div></section>` : ''}${link('activity', '← All activity', 'text-link')}</div>`, true);
        }
        const future = rows('announcements').filter(upcoming).sort(byDate), past = rows('announcements').filter(a => !upcoming(a)).sort((a, b) => byDate(b, a));
        return page('Laboratory activity', 'Presentations, exchange & recognition.', 'Upcoming presentations, seminar announcements and documented researcher milestones.', `<section class="content-section"><h2>Upcoming activities</h2><div class="event-list">${future.map(a => announcementCard(a)).join('') || empty('No upcoming activities published.', 'New approved notices will appear here.')}</div></section>${past.length ? `<section class="content-section"><h2>Past activity</h2><div class="event-list">${past.map(a => announcementCard(a)).join('')}</div></section>` : ''}${rows('achievements').length ? `<section class="content-section"><h2>Researcher recognition</h2>${rows('achievements').map(a => achievementCard(a, true)).join('')}</section>` : ''}`, true);
    }

    function updateCard(p) { return `<article class="record-card"><p class="eyebrow">${E(p.date)} · ${E(nice(p.kind))}</p><h3>${E(p.title)}</h3><p class="profile-text">${E(p.text)}</p>${extraBlock('updates',p)}</article>`; }
    function publicBioSection(title, html, id) { return `<section class="content-section" id="${E(id)}"><h2>${E(title)}</h2>${html}</section>`; }

    function mediaCard(m) {
        const source = mediaURL(m.asset_url);
        if (!source) return '';
        const visual = m.kind === 'video' ? `<video controls playsinline preload="metadata" aria-label="${E(m.alt || m.title)}"><source src="${E(source)}">Your browser cannot play this video. ${mediaLink(source,'Open video')}</video>` : m.kind === 'document' ? `<div class="media-document"><span aria-hidden="true">PDF</span>${mediaLink(source,m.title,'button secondary')}</div>` : `<a href="${E(source)}" target="_blank" rel="noopener" aria-label="Open full photograph"><img src="${E(source)}" alt="${E(m.alt || m.title)}" loading="lazy"></a>`;
        return `<figure class="gallery-card">${visual}<figcaption><h3>${E(m.title)}</h3>${m.caption ? `<p class="profile-text">${E(m.caption)}</p>` : ''}${m.credit ? `<small>${E(m.credit)}</small>` : ''}${m.transcript ? `<details><summary>Video transcript / description</summary><p class="profile-text">${E(m.transcript)}</p></details>` : ''}</figcaption></figure>`;
    }
    function customSection(s) {
        const media = (s.media_items || []).map(id => one('media',id)).filter(Boolean);
        const content = `<div class="custom-section-copy"><p class="eyebrow">${E(s.eyebrow)}</p><h2>${E(s.title)}</h2><p class="profile-text">${E(s.body)}</p></div>`;
        const gallery = media.length ? `<div class="gallery-grid">${media.map(mediaCard).join('')}</div>` : '';
        return `<section class="section custom-section layout-${E(s.layout)}" id="section-${E(s.id)}"><div class="container custom-section-inner">${content}${gallery}${extraBlock('sections',{...s,media_items:[]})}</div></section>`;
    }
    const customHome = position => rows('sections').filter(s => s.location === 'homepage' && (s.position || 'before-footer') === position).sort((a,b)=>(a.order||0)-(b.order||0)).map(customSection).join('');
    function customPage(id) {
        const s = one('sections',id);
        return s ? head('Laboratory',s.title) + customSection(s) : notFound();
    }
    function galleryPage() {
        return page('Media library','Inside the laboratory.','Photographs, videos and documents approved for public sharing.',`<div class="gallery-grid">${rows('media').map(mediaCard).join('') || empty('No public media yet.','Approved laboratory photographs and recordings will appear here.')}</div>`);
    }
    function profileContact(p) {
        return `<dl class="profile-contact">${p.qualifications ? `<div><dt>Qualifications</dt><dd>${E(p.qualifications)}</dd></div>` : ''}${p.affiliation ? `<div><dt>Institution</dt><dd>${E(p.affiliation)}</dd></div>` : ''}${p.department ? `<div><dt>Department</dt><dd>${E(p.department)}</dd></div>` : ''}${p.public_email ? `<div><dt>Email</dt><dd><a href="mailto:${E(p.public_email)}">${E(p.public_email)}</a></dd></div>` : ''}${p.public_phone ? `<div><dt>Professional phone</dt><dd>${E(p.public_phone)}</dd></div>` : ''}${p.website ? `<div><dt>Website</dt><dd>${external(p.website,'Professional website')}</dd></div>` : ''}</dl>`;
    }

    function home() {
        const s = rows('settings')[0] || {};
        const caps = [...rows('capabilities')].sort((a, b) => (a.order || 0) - (b.order || 0));
        const capCards = list => list.map((r, i) => `<article class="research-card" id="${E(r.id)}"><span class="research-number">${String(r.order || i + 1).padStart(2, '0')}</span><h3>${E(r.title)}</h3><p>${E(r.text)}</p>${extraBlock('capabilities',r)}</article>`).join('');
        const roster = group => rows('people').filter(p => p.group === group).map(p => `<a class="roster-link" href="#/profiles/${E(profileSlugs[p.id] || p.id)}">${avatar(p, 'small')}<span>${E(p.name)}</span><span class="arrow" aria-hidden="true">↗</span></a>`).join('');
        return `<section class="hero ${s.hero_motion ? 'hero-has-motion' : ''}">${mediaURL(s.hero_image_url) ? `<div class="lab-photo-atmosphere" aria-hidden="true"><img src="${E(mediaURL(s.hero_image_url))}" alt=""></div>` : ''}<div class="container hero-grid"><div><p class="eyebrow">${E(s.hero_eyebrow||'TED² · University of Namibia')}</p><h1>${E(s.hero_title || 'Engineering better biomedical solutions.')}</h1><p class="lead">${E(s.hero_intro)}</p><div class="actions">${link('researchers', 'Meet our researchers →', 'button')}${link('research', 'Explore research', 'button secondary')}</div><div class="hero-meta"><span><strong>Research.</strong> Translation.</span><span><strong>Biomedical</strong> innovation.</span></div></div><div class="hero-visual"><div class="hero-photo media-frame image-failed"><div class="media-fallback"><img src="${E(window.TED2_WORDMARK)}" alt=""><span>Tissue engineering · drug development · collaborative research</span></div>${mediaURL(s.hero_image_url) ? `<img class="remote-image hero-remote" src="${E(mediaURL(s.hero_image_url))}" alt="${E(s.hero_image_alt || 'Laboratory research')}" fetchpriority="high">` : ''}</div><div class="photo-label"><div><small>${E(s.hero_image_caption || 'From cells to therapeutic platforms')}</small><br><strong>Research with purpose.</strong></div><span class="photo-number">TED²</span></div></div></div></section>
    <nav class="section-nav" aria-label="Homepage sections"><div class="container"><span>Explore</span><a href="#/?section=alerts">Alerts & events</a><a href="#/?section=research">Research capabilities</a><a href="#/?section=interactions">Cell–material interactions</a><a href="#/?section=scaffolds">Scaffolds & applications</a><a href="#/?section=people">Our people</a>${rows('sections').filter(x=>x.navigation && x.location==='homepage').map(x=>link('?section=section-'+x.id,x.nav_label || x.title)).join('')}</div></nav>
    ${customHome('after-hero')}${homeAlerts()}${customHome('after-alerts')}
    <section class="section" id="research"><div class="container"><div class="section-head"><div><p class="eyebrow">01 / Research capabilities</p><h2>${E(s.research_title||'Understanding life. Designing what comes next.')}</h2></div></div><div class="research-grid">${capCards(caps.slice(0, 5))}</div></div></section>
    ${customHome('after-research')}<section class="section section-cream" id="interactions"><div class="container feature-grid"><div class="feature-typeset"><div><p class="eyebrow">02 / Cell–material interactions</p><h2>${E(s.interactions_title||'Better materials. Closer to biology.')}</h2></div><div class="feature-rule"><span class="feature-mark">2D / 3D</span><p>Adhesion · proliferation · differentiation</p></div></div><div class="topic-list">${caps.slice(5, 9).map(r => `<article class="topic-row"><h3>${E(r.title)}</h3><p>${E(r.text)}</p>${extraBlock('capabilities',r)}</article>`).join('')}</div></div></section>
    <section class="section" id="scaffolds"><div class="container"><div class="section-head"><div><p class="eyebrow">03 / Scaffolds & applications</p><h2>${E(s.scaffolds_title||'Materials designed around biology.')}</h2></div></div><div class="research-grid">${capCards(caps.slice(9))}</div><div class="split-images">${[[s.materials_image_url, 'Illustrative materials photograph from the reference website.'], [s.microscopy_image_url, 'Illustrative microscopy from the reference website; not TED² experimental data.']].filter(([u]) => safeURL(u)).map(([u, caption]) => `<figure><div class="feature-image media-frame image-failed"><div class="media-fallback"><img src="${E(window.TED2_WORDMARK)}" alt=""><span>Reference photograph unavailable.</span></div><img class="remote-image hero-remote" src="${E(u)}" alt="${E(caption)}" loading="lazy"></div><figcaption class="feature-caption">${E(caption)} ${link('sources', 'Image credits')}</figcaption></figure>`).join('')}</div></div></section>
    <section class="section section-cream" id="people"><div class="container"><div class="section-head"><div><p class="eyebrow">04 / Our people</p><h2>${E(s.people_title||'The people behind the questions.')}</h2><p class="lead">Open an individual profile for selected work, publications and approved research activity.</p></div></div><div class="people-home-grid"><div class="roster-panel"><div class="roster-panel-header"><h3>Researchers</h3><span>${rows('people').filter(p => p.group === 'researcher').length} profiles</span></div>${roster('researcher')}</div><div><div class="roster-panel"><div class="roster-panel-header"><h3>Collaborators</h3><span>${rows('people').filter(p => p.group === 'collaborator').length} profiles</span></div>${roster('collaborator')}</div><div class="directory-callout"><h4>Research has a story.</h4><p>Follow approved active research and manuscript stages, with individual researchers at the centre.</p>${link('pipeline', 'View the manuscript pipeline →', 'text-link')}</div></div></div></div></section>${homeRecognition()}${customHome('before-footer')}${contact(true)}`;
    }
    function contact(section=false) {
        const s=rows('settings')[0]||{};
        const inner=`<section class="section contact-section" id="contact"><div class="container"><div class="contact-grid"><div><p class="eyebrow">Visit & connect</p><h2>${E(s.contacts_title||'Good research starts with a conversation.')}</h2><p>Research enquiries, collaboration discussions and laboratory information.</p></div><dl class="contact-list">${s.title?`<div><dt>Laboratory</dt><dd>${E(s.title)}</dd></div>`:''}${s.contact_name||s.contact_email?`<div><dt>Public contact</dt><dd>${E(s.contact_name)}${s.contact_email?`<br><a href="mailto:${E(s.contact_email)}">${E(s.contact_email)}</a>`:''}</dd></div>`:''}${s.address?`<div><dt>Location</dt><dd class="profile-text">${E(s.address)}</dd></div>`:''}</dl></div>${contactsFor('',section)}${extraBlock('settings',s)}</div></section>`;
        return section?inner:head('Contact','Connect with the laboratory.')+inner;

        t.select();
        const ok = document.execCommand('copy');
        t.remove();
        toast(ok ? 'Citation copied.' : 'Clipboard unavailable. Copy the citation from the publication record.');
    } });
    document.getElementById('menu-toggle').addEventListener('click', () => { const open = nav.classList.toggle('open'); document.getElementById('menu-toggle').setAttribute('aria-expanded', String(open)); });
    async function start() { if (cfg.live) {
        try {
            const response = await fetch((cfg.apiBase || '') + '/api/public', { credentials: 'omit', cache: 'no-store', signal: AbortSignal.timeout(15000) });
            if (!response.ok)
                throw Error();
            data = await response.json();
            document.getElementById('freshness').textContent = 'Local/live public preview · refreshed ' + new Date().toLocaleString();
        }
        catch {
            main.innerHTML = page('Connection unavailable', 'The research server could not be reached.', 'Please try again shortly. Private records are not stored in this public file.', `<button class="button" id="retry">Try again</button>`);
            document.getElementById('retry').addEventListener('click', () => location.reload());
            document.getElementById('freshness').textContent = 'Live connection unavailable';
            return;
        }
    }
    else
        document.getElementById('freshness').textContent = 'Public snapshot · content reviewed ' + (rows('settings')[0]?.reviewed || 'not recorded'); render(); window.addEventListener('hashchange', render); }
    start();
})();
</script></body></html>
