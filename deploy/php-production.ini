; Apply to a dedicated FPM pool. Keep source/database writable only by the service account.
expose_php = Off
display_errors = Off
log_errors = On
file_uploads = On
upload_max_filesize = 80M
post_max_size = 84M
memory_limit = 512M
max_execution_time = 330
max_input_time = 330
cgi.fix_pathinfo = 0
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
